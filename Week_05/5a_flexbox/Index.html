<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Flexbox</title>
  </head>
  <body>
    <h1>Gallery of Frogs</h1>
    <div class="gallery-container">

        <div class="card">
          <img src="images/redeye.jpg" alt="Red eye tree frog" />

        <div class="card">
          <img src="images/yellow.jpg" alt="Yellow spotted frog" />
          <h3>Yellow Dart Frog</h3>

      </div>
    </div>

    <footer><a href="../../index.html">Back to Home</a></footer>
