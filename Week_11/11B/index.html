<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <title>DOM & Javascript</title>
  </head>
  <body>
    <div class="buttons">
      <button onclick="setBgColor('#0f1b1d')">Dark Mode</button>
      <button onclick="setBgColor('#ccf0f4')">Light Mode</button>
    </div>
    <div class="container">
      <figcaption id="caption">
        <h1>My Tattoo Gallery</h1>
      </figcaption>
      <div class="grid-container">
        <div>
          <img
            src="images/frogs.jpeg"
            alt="a tattoo in a neo traditional style of mr.toad and mr.frog"
            onclick="change('images/frogs.jpeg', 'Mr. Toad and Mr.Frog')"
          />
        </div>
        <div>
          <img
            src="images/snoopy.jpeg"
            alt="a neo traditional tattoo of snoopy"
            onclick="change('images/snoopy.jpeg', 'Snoopy')"
          />
        </div>
        <div>
          <img
            src="images/butterfly.jpeg"
            alt="a traditional tattoo of a butterfly"
            onclick="change('images/butterfly.jpeg', 'Butterfly')"
          />
        </div>
        <div>
          <img
            src="images/flowers.jpg"
            alt="a traditional illustration of large pink flowers with a butterfly"
            onclick="change('images/flowers.jpg', 'Pink Flowers')"
          />
        </div>
        <div>
          <img
            src="images/bird.jpg"
            alt="a traditional illustration of a bird with flowers in it's beak"
            onclick="change('images/bird.jpg', 'Bluebird')"
          />
        </div>
      </div>
      <div>
        <img src="images/frogs.jpeg" id="large" />
      </div>
      <script src="script.js"></script>
    </div>
    <footer>
      <a href="../../index.html">Student Portal</a>
    </footer>
  </body>
</html>
