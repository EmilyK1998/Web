<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Animations</title>
  </head>

  <body>
    <div class="scene">
      <div class="kenburns-top">
        <img
          src="images/background.svg"
          alt="A simple illustrated background, with a blue sky, green grass, trees, and mountains."
        />
      </div>
      <div class="tracking-in-expand-fwd">
        <h1>Welcome to the Mystical Woods</h1>
      </div>
      <div class="heartbeat">
        <img
          src="images/pulsingbirds.svg"
          alt="a flock of a black silhouette of birds"
        />
      </div>
      <div class="bounce-in-left">
        <img
          src="images/bouncingbunny.svg"
          alt="a photo of a cartoon rabbit holding a carrot, both have simple cute faces"
        />
      </div>
      <div class="rotate-left">
        <img
          src="images/slidingfairy.png"
          alt="a small cartoon fairy with pink hair, and little wings, and a tiny wand"
        />
        <div class="slide-out-left">
          <img
            src="images/exitunicorn.png"
            alt="a white unicorn with a rainbow main, facing away from the camera"
          />
        </div>
      </div>
      <footer>
        <a href="../../index.html">Student Portal</a>
      </footer>
    </div>
  </body>
</html>
