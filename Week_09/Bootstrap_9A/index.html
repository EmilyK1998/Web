<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container bg-warning">
      <div class="text-center">
        <h1>Halloween</h1>
      </div>
      <div class="row">
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/blackcat.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="close-up of pitch black cat with orange eyes with an orange sparkly background"
            />
            <div class="text-center">
              <h3>Spooky Black Cat</h3>
            </div>
          </div>
        </div>
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/skeleton.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="two skeletons in chairs on a porch with a table between them with an orange jack-o-lantern pumpkin"
            />
            <div class="text-center">
              <h3>Scary Skeletons</h3>
            </div>
          </div>
        </div>
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/ghost.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="a person with a white sheet over their head standing in a field of long grass and native plants"
            />
            <div class="text-center">
              <h3>Haunted Ghost</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="fluid-container bg-secondary">
      <div class="text-center">
        <h1>Gallery</h1>
      </div>
      <div class="row">
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/pumpkin.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="a group of dark jack-o-lanterns illuminated by various color candles inside them"
            />
            <div class="text-center">
              <h3>Dubious Pumpkins</h3>
            </div>
          </div>
        </div>
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/fullmoon.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="A spooky yellow color full moon with a dark tree branch in the foreground"
            />
            <div class="text-center">
              <h3>Malicious Full Moon</h3>
            </div>
          </div>
        </div>
        <div class="card col col-12 col-md-6 col-lg-4">
          <div class="card-body">
            <img
              src="images/witch.jpg"
              class="img-fluid border rounded shadow-sm"
              alt="a woman with red hair, and a green witch outfit standing near tall foliage on a dirt path outside"
            />
            <div class="text-center">
              <h3>Cursed Witch</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div class="text-center">
        <p><a href="../../index.html">Student Portal</a></p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
