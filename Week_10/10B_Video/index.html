<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Multimedia Imbeds</title>
  </head>
  <body>
    <div class="hero">
      <div class="hero-text">
        <h1>Chill Vibes Only Please</h1>
      </div>
      <div class="hero-video">
        <video autoplay muted loop poster="images/goop.mp4" class="w-100">
          <source src="images/goop.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
    <audio controls>
      <source src="images/chill.mp3" type="audio/mpeg" />
    </audio>
    <main class="main">
      <h2>One Funny Video for the Road</h2>
    </main>
    <div class="ratio-16x9">
      <iframe
        src="https://www.youtube.com/embed/ewyGvzPHL7E"
        title="YouTube video player"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
        "
        allowfullscreen
      ></iframe>
    </div>
    <footer><a href="../../index.html">Student Portal</a></footer>
  </body>
</html>
